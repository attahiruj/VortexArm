nodes:
  - id: ssc32u_controller
    path: ssc32u_controller/ssc32u_controller/main.py
    inputs:
      tick: dora/timer/millis/100
    outputs:
      - speech

  - id: inverse_kinematics
    path: inverse_kinematics/inverse_kinematics/main.py
    inputs:
      tick: dora/timer/millis/100

    outputs:
      - tick
  
  - id: webcam
    operator:
      python: vision/vision/webcam.py
      inputs:
        tick: dora/timer/millis/100
      outputs:
        - image
  
  - id: object_detection
    operator:
      python: vision/vision/object_detection.py
      inputs:
        image: webcam/image
      outputs:
        - bbox
  
  - id: plot
    operator:
      python: vision/vision/plot.py
      inputs:
        image: webcam/image
        bbox: object_detection/bbox
      
  - id: test_k
    path: test_k/test_k/main.py
    inputs:
      tick: dora/timer/millis/100
    outputs:
      - speech